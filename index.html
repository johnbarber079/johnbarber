<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>John Barber</title>
<meta name="description" content="Corte e barba com estilo. Fale com John Barber.">
<meta name="theme-color" content="#0b0c0f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0c0f;--cream:#f2e8dc;--copper:#c98f5f;--muted:#a39a90;--line:#2a2c32}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--cream);display:flex;justify-content:center;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.glow{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.glow i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5}
.glow i:nth-child(1){width:380px;height:380px;background:#3a4256;left:-120px;top:-60px;opacity:.35;animation:d1 18s ease-in-out infinite alternate}
.glow i:nth-child(2){width:420px;height:420px;background:#8a5f3d;right:-160px;bottom:-80px;animation:d2 22s ease-in-out infinite alternate}
.glow i:nth-child(3){width:260px;height:260px;background:#c98f5f;left:20%;bottom:-120px;opacity:.22;animation:d1 26s ease-in-out infinite alternate-reverse}
@keyframes d1{to{transform:translate(120px,90px) scale(1.15)}}
@keyframes d2{to{transform:translate(-110px,-80px) scale(1.1)}}
.glow::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,transparent 30%,rgba(0,0,0,.55) 100%)}
.wrap{position:relative;width:100%;max-width:460px;padding:calc(40px + env(safe-area-inset-top,0px)) 24px calc(34px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;text-align:center}
.medal{position:relative;width:176px;height:176px;border-radius:50%}
.medal::before{content:"";position:absolute;inset:-9px;border-radius:50%;background:repeating-conic-gradient(var(--copper) 0 9deg,var(--cream) 9deg 18deg,#2b2d33 18deg 27deg);-webkit-mask:radial-gradient(circle,transparent 63%,#000 64%);mask:radial-gradient(circle,transparent 63%,#000 64%);animation:spin 16s linear infinite;animation-play-state:paused}
.ready .medal::before{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.medal img{position:relative;width:100%;height:100%;border-radius:50%;display:block;box-shadow:0 18px 50px rgba(0,0,0,.6)}
.medal::after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.22) 50%,transparent 60%);background-size:250% 100%;background-position:150% 0;animation:shine 6s ease-in-out infinite 1.6s;animation-play-state:paused}
.ready .medal::after{animation-play-state:running}
@keyframes shine{0%{background-position:150% 0}35%,100%{background-position:-50% 0}}
h1{font-size:clamp(28px,8vw,34px);line-height:1.12;font-weight:800;letter-spacing:-.02em;margin-top:34px}
p.sub{color:var(--muted);font-size:16px;line-height:1.6;margin-top:12px;max-width:32ch;font-weight:500}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:18px}
.chips span{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border:1px solid var(--line);background:rgba(21,23,28,.7);border-radius:999px;font-size:13px;font-weight:600}
.chips svg{width:16px;height:16px;color:var(--copper)}
.btns{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:28px}
.btn{display:flex;align-items:center;justify-content:center;gap:12px;min-height:58px;border-radius:14px;font:700 16px/1 Montserrat,system-ui,sans-serif;text-decoration:none;transition:transform .18s ease,box-shadow .18s ease,background .18s ease}
.btn svg{width:22px;height:22px;flex:none}
.wa{background:var(--copper);color:#14100c}
.ig{background:rgba(21,23,28,.75);color:var(--cream);border:1.5px solid #4a4d55}
.btn:hover{transform:translateY(-2px)}
.wa:hover{background:#dba473;box-shadow:0 10px 28px rgba(201,143,95,.35)}
.ig:hover{border-color:var(--copper)}
.btn:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
.btn:active{transform:scale(.98)}
.foot{margin-top:26px;font-size:13px;color:var(--muted);font-weight:500}
.medal,h1,p.sub,.chips,.btn,.foot{opacity:0;transform:translateY(14px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.ready .medal,.ready h1,.ready p.sub,.ready .chips,.ready .btn,.ready .foot{opacity:1;transform:none}
.ready h1{transition-delay:.22s}.ready p.sub{transition-delay:.35s}.ready .chips{transition-delay:.48s}.ready .wa{transition-delay:.62s}.ready .ig{transition-delay:.74s}.ready .foot{transition-delay:.9s}
.ready .btn:hover{transition-delay:0s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.medal,h1,p.sub,.chips,.btn,.foot{opacity:1;transform:none}}
</style>
</head>
